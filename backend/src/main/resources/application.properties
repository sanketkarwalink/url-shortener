server.port=8080

# Dev defaults (H2). Override with SPRING_PROFILES_ACTIVE=postgres for production.
spring.datasource.url=jdbc:h2:file:./data/urlshortener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.base-url=http://localhost:8080
app.cors-origins=http://localhost:3000

# JWT
app.jwt.secret=url-shortener-dev-secret-key-change-in-production-min-32-chars!!
app.jwt.expiration-ms=86400000

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
